name: Analizar competidores nuevos
# Lo dispara el panel al agregar un competidor en Espia. Solo procesa los que
# estan en cola (estado pendiente); la sincronizacion diaria refresca el resto.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingesta-competencia
  cancel-in-progress: false
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Santiago
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ingesta
      - name: Credenciales
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          umask 077
          for v in IG_ACCESS_TOKEN IG_BUSINESS_ID IG_API_VERSION SUPABASE_URL SUPABASE_SERVICE_KEY; do
            printf '%s=%s\n' "$v" "${!v}" >> .env
          done
      - name: Competidores en cola
        run: python3 tools/ig_competencia.py
