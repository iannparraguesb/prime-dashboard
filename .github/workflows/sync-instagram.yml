name: Sincronizar Instagram (cada hora)
# Historias activas + las 25 publicaciones mas recientes + miniaturas nuevas.
# Las historias desaparecen de la API a las 24 h: si esto deja de correr, se pierden.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingesta-instagram
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    # La primera pasada de cada alumno trae 100 publicaciones con estadisticas.
    timeout-minutes: 20
    env:
      TZ: America/Santiago
    defaults:
      run:
        working-directory: ingesta
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ingesta
      - name: Credenciales
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          umask 077
          for v in IG_ACCESS_TOKEN IG_BUSINESS_ID IG_API_VERSION SUPABASE_URL SUPABASE_SERVICE_KEY; do
            printf '%s=%s\n' "$v" "${!v}" >> .env
          done
      - name: Historias activas
        run: python3 tools/ig_historias.py
      - name: Publicaciones recientes
        if: ${{ !cancelled() }}
        run: python3 tools/ig_dump.py --solo piezas --limite 25
      - name: Cargar a Supabase
        if: ${{ !cancelled() }}
        run: python3 tools/ig_a_supabase.py --miniaturas
      - name: Alumnos conectados
        if: ${{ !cancelled() }}
        run: python3 tools/ig_alumnos.py
